<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot phrases</title>
<meta name="description" content="Free dot phrases / SmartPhrases for family medicine, in Cerner and Epic formats.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff; --side: #f6f7f9; --ink: #16191d; --muted: #646b75; --line: #e3e6ea; --sel: #e9f1fb; --accent: #1764b0;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --side: #1b1e22; --ink: #e4e7eb; --muted: #959ca6; --line: #2b2f35; --sel: #1d2a3a; --accent: #6aa8ec; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  button, input { font: inherit; color: inherit; }

  .top { display: flex; align-items: center; gap: 12px 20px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 600; text-decoration: none; color: inherit; white-space: nowrap; }
  #q { flex: 1 1 300px; max-width: 560px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--side); outline: none; }
  #q:focus { border-color: var(--accent); background: var(--bg); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  .csv { margin-left: auto; color: var(--muted); font-size: 14px; }
  .chips { display: none; }

  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(340px, 28vw) minmax(0, 1fr); }
  #toc, #list, #view { overflow: auto; min-height: 0; }

  #toc { background: var(--side); border-right: 1px solid var(--line); padding: 12px 0 24px; font-size: 14px; }
  #toc .fam { display: flex; gap: 8px; padding: 10px 16px 4px; font-weight: 600; cursor: pointer; }
  #toc .fam b { font: 500 15px var(--mono); color: var(--accent); width: 1ch; }
  #toc a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 16px 3px 33px; color: var(--muted); text-decoration: none; }
  #toc a:hover { color: var(--ink); background: var(--line); }
  #toc a.empty { display: none; }
  .note { padding: 20px 16px; color: var(--muted); font-size: 12px; }

  #list { border-right: 1px solid var(--line); outline: none; }
  .sh { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .sh code { font: 500 12px var(--mono); color: var(--accent); text-transform: none; margin-left: 6px; }
  .row { display: flex; gap: 12px; padding: 6px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .row:hover { background: var(--side); }
  .row[aria-selected=true] { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  .row .ab { flex: 0 0 9rem; font: 500 13.5px/1.6 var(--mono); color: var(--accent); overflow-wrap: anywhere; }
  .row .ti { flex: 1; min-width: 0; }
  .sdg { border-top: 1px solid var(--line); padding: 4px; text-align: center; font-size: 11px; letter-spacing: .3em; color: var(--muted); }
  .hidden { display: none !important; }

  #view { padding: 20px 32px 40px; }
  #view .crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  #view h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  #view h1 code { font: 500 20px var(--mono); color: var(--accent); }
  .stamp { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .stamp.ok { color: #2e7d4f; }
  #view .use { color: var(--muted); margin: 4px 0 14px; max-width: 80ch; }
  .acts { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  .acts button { border: 1px solid var(--line); background: var(--bg); padding: 5px 14px; border-radius: 6px; cursor: pointer; }
  .acts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .acts.nav { display: none; }
  pre { margin: 0; padding: 16px 18px; background: var(--side); border: 1px solid var(--line); border-radius: 6px; font: 13.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 120ch; }
  .hint { margin-top: 10px; font-size: 13px; color: var(--muted); max-width: 120ch; }
  .hint code { font-family: var(--mono); color: var(--ink); }

  @media (max-width: 1200px) { .app { grid-template-columns: 200px minmax(300px, 32vw) minmax(0, 1fr); } .row .ab { flex-basis: 8rem; } }
  @media (max-width: 960px) { .app { grid-template-columns: minmax(280px, 40vw) minmax(0, 1fr); } #toc { display: none; } .chips { display: flex; gap: 4px; } }

  @media (max-width: 700px) {
    .top { padding: 8px 12px; gap: 8px; }
    #q { flex-basis: 100%; max-width: none; order: 3; font-size: 16px; }
    .seg { margin-left: auto; }
    .csv { display: none; }
    .chips { order: 4; width: 100%; }
    .app { grid-template-columns: minmax(0, 1fr); }
    #list { border-right: 0; }
    .row { flex-direction: column; gap: 0; padding: 8px 12px; }
    .row .ab { flex-basis: auto; }
    #view { display: none; }
    body.reading #view { display: block; position: fixed; inset: 0; z-index: 5; background: var(--bg); padding: 12px 14px 32px; }
    .acts.nav { display: flex; }
    pre { font-size: 12.5px; padding: 12px; }
  }
  .chips a { font: 500 15px var(--mono); color: var(--accent); text-decoration: none; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">Dot phrases</a>
  <input type="search" id="q" placeholder="Search" aria-label="Search phrases" autocomplete="off">
  <div class="seg" role="group" aria-label="Format">
    <button type="button" data-fmt="cerner" aria-pressed="true">Cerner</button><button type="button" data-fmt="epic" aria-pressed="false">Epic</button>
  </div>
  <nav class="chips" aria-label="Jump to"><a href="#" data-f="%">%</a><a href="#" data-f="&amp;">&amp;</a><a href="#" data-f="$">$</a><a href="#" data-f="#">#</a><a href="#" data-f=".">.</a></nav>
  <a class="csv" href="phrases.csv" download>Download CSV</a>
</header>
<div class="app">
  <nav id="toc" aria-label="Sections"></nav>
  <div id="list" role="listbox" aria-label="Phrases" tabindex="0"></div>
  <article id="view" aria-live="polite"></article>
</div>
<footer class="sdg">SDG</footer>
<script>
const FAM = { '%': 'OB / L&D', '&': 'Inpatient', '$': 'Clinic', '#': 'Problems', '.': 'Anywhere' };
const $ = s => document.querySelector(s);
const phone = matchMedia('(max-width: 700px)');
let rows = [], byAbbr = {}, sel = null, fmt = localStorage.getItem('fmt') || 'cerner';
const famHead = {}, secs = [];

function build() {
  const list = $('#list'), toc = $('#toc');
  let fam = null, sec = null;
  for (const r of rows) {
    if (r.family !== fam) {
      fam = r.family; sec = null;
      const f = document.createElement('div'); f.className = 'fam';
      f.innerHTML = '<b></b><span></span>';
      f.firstChild.textContent = fam; f.lastChild.textContent = FAM[fam];
      const target = fam; f.onclick = () => jumpFam(target);
      toc.append(f);
    }
    if (r.section !== sec?.name) {
      const h = document.createElement('div'); h.className = 'sh'; h.textContent = r.section;
      if (r.tag) { const c = document.createElement('code'); c.textContent = r.tag; h.append(c); }
      const a = document.createElement('a'); a.href = '#'; a.innerHTML = '<span></span><span></span>';
      a.firstChild.textContent = r.section;
      sec = { name: r.section, h, a, rows: [] }; secs.push(sec);
      a.onclick = e => { e.preventDefault(); h.scrollIntoView({ block: 'start' }); };
      famHead[fam] ??= h;
      list.append(h); toc.append(a);
    }
    const d = document.createElement('div'); d.className = 'row'; d.setAttribute('role', 'option');
    d.innerHTML = '<span class="ab"></span><span class="ti"></span>';
    d.firstChild.textContent = r.abbr; d.lastChild.textContent = r.desc;
    d.onclick = () => select(r, true);
    r.el = d; sec.rows.push(r); list.append(d);
  }
  toc.insertAdjacentHTML('beforeend', '<div class="note">Templates, not medical advice.</div>');
}

function jumpFam(f) { famHead[f]?.scrollIntoView({ block: 'start' }); }

function select(r, fromUser) {
  if (sel) sel.el.setAttribute('aria-selected', 'false');
  sel = r; r.el.setAttribute('aria-selected', 'true');
  render();
  const url = '#' + encodeURIComponent(r.abbr);
  if (phone.matches && fromUser) { history.pushState(null, '', url); document.body.classList.add('reading'); $('#view').scrollTop = 0; }
  else history.replaceState(null, '', url);
  if (!phone.matches) r.el.scrollIntoView({ block: 'nearest' });
}

function render() {
  const r = sel, v = $('#view'); if (!r) return;
  const text = fmt === 'epic' ? r.epic : r.body;
  v.innerHTML = `<div class="acts nav"><button class="back" type="button">&larr; Back</button></div>
    <div class="crumb"></div><h1><code></code><span></span></h1><p class="stamp"></p><p class="use"></p>
    <div class="acts"><button class="primary copy" type="button"></button><button class="link" type="button">Copy link</button></div>
    <pre></pre>` + (fmt === 'epic' ? `<p class="hint"><code>***</code> blank &middot; <code>{a/b}</code> build as a SmartList &middot; <code>@NAME@</code> your SmartLink &middot; <code>[ ]</code> Cerner template, swap in yours</p>` : '');
  v.querySelector('.crumb').textContent = r.family + '  ' + FAM[r.family] + '  /  ' + r.section;
  v.querySelector('h1 code').textContent = r.abbr;
  v.querySelector('h1 span').textContent = r.desc;
  const st = v.querySelector('.stamp');
  st.textContent = 'Updated ' + day(r.updated) + '  ·  ' + (r.verified ? 'Verified against sources ' + day(r.verified) + (r.verified_source ? ' (' + r.verified_source + ')' : '') : 'Not yet verified against current guidelines');
  st.classList.toggle('ok', !!r.verified);
  const use = v.querySelector('.use'); r.use ? use.textContent = r.use : use.remove();
  v.querySelector('pre').textContent = text;
  const copy = v.querySelector('.copy'); copy.textContent = 'Copy ' + (fmt === 'epic' ? 'Epic' : 'Cerner');
  copy.onclick = () => navigator.clipboard.writeText(text).then(() => flash(copy, 'Copied'));
  const link = v.querySelector('.link');
  link.onclick = () => navigator.clipboard.writeText(location.href).then(() => flash(link, 'Copied'));
  v.querySelector('.back').onclick = () => history.back();
}

function day(d) { return new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); }

function flash(b, t) { const o = b.textContent; b.textContent = t; setTimeout(() => b.textContent = o, 1200); }

function filter() {
  const q = $('#q').value.trim().toLowerCase();
  for (const r of rows) r.el.classList.toggle('hidden', !!q && !r.hay.includes(q));
  for (const s of secs) {
    const k = s.rows.filter(r => !r.el.classList.contains('hidden')).length;
    s.h.classList.toggle('hidden', !k); s.a.classList.toggle('empty', !k); s.a.lastChild.textContent = k;
  }
}

function step(dir) {
  const vis = rows.filter(r => !r.el.classList.contains('hidden'));
  if (!vis.length) return;
  const i = sel ? vis.indexOf(sel) : -1;
  select(vis[Math.max(0, Math.min(vis.length - 1, i < 0 ? 0 : i + dir))], false);
}

function setFmt(f) {
  fmt = f; localStorage.setItem('fmt', f);
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.fmt === f));
  render();
}

function fromHash() {
  const r = byAbbr[decodeURIComponent(location.hash.slice(1))];
  document.body.classList.toggle('reading', !!r && phone.matches);
  if (r) { select(r, false); r.el.scrollIntoView({ block: 'center' }); }
  else if (!phone.matches && !sel && rows.length) select(rows[0], false);
}

fetch('phrases.json').then(r => r.json()).then(data => {
  rows = data.map(r => ({ ...r, hay: (r.abbr + ' ' + r.desc + ' ' + r.body).toLowerCase() }));
  for (const r of rows) byAbbr[r.abbr] = r;
  $('#q').placeholder = 'Search ' + rows.length + ' phrases';
  build(); filter(); setFmt(fmt); fromHash();
});
addEventListener('popstate', fromHash);
$('#q').addEventListener('input', filter);
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setFmt(b.dataset.fmt));
document.querySelectorAll('.chips a').forEach(a => a.onclick = e => { e.preventDefault(); jumpFam(a.dataset.f); });
addEventListener('keydown', e => {
  if (phone.matches) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); step(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape') { $('#q').value = ''; filter(); }
});
</script>
</body>
</html>
